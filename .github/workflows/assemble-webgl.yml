name: Assemble WebGL deployment

on:
  push:
    branches:
      - gh-pages
    paths:
      - ".deploy-parts/**"
      - ".github/workflows/assemble-webgl.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify build
        shell: bash
        run: |
          cat .deploy-parts/data/part-* > "Build/Detective A&I.data.gz"
          cat .deploy-parts/wasm/part-* > "Build/Detective A&I.wasm.gz"
          cp .deploy-parts/loader.js "Build/Detective A&I.loader.js"
          gzip -t "Build/Detective A&I.data.gz"
          gzip -t "Build/Detective A&I.framework.js.gz"
          gzip -t "Build/Detective A&I.wasm.gz"
          test "$(sha256sum "Build/Detective A&I.data.gz" | cut -d' ' -f1)" = "453f82e9e390a988d32fcacd51144da005c0fac4b937afe369ad563b52b2e0e3"
          test "$(sha256sum "Build/Detective A&I.wasm.gz" | cut -d' ' -f1)" = "29accab94b70bc7c08f3320fafc678b54685d1f5aa48c918d5f668281ecaeaa2"
          test "$(sha256sum "Build/Detective A&I.loader.js" | cut -d' ' -f1)" = "5d9ad0934843a9349094481a8f890734a9625d4bd51a00ee3b676aba2452863f"

      - name: Commit assembled deployment
        shell: bash
        run: |
          rm -rf .deploy-parts
          rm -f .github/workflows/assemble-webgl.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy updated WebGL build"
          git push
